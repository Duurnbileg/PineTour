<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="display">
        <section class="container">
            <div class="top">
                <p class="Title">Stopwatch</p>
                <div class="time">11:00:00</div>
            </div>
            <div class="left">
                <button>Pause</button>
                <button>Stop</button>
                <button>Lap</button>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
