<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <img src="./Assets/Default - White.png" alt="" style="height: 49px;
        width: 391px;">
        <section id="content">
            <div id="input"></div>
            <div class="buttonContainer">
                <div class="button greyBG"><img src="./Assets/image 1.png" alt="" style="height: 44px; width: 44px;">
                </div>
                <div class="button greyBG">AC</div>
                <div class="button greyBG">%</div>
                <div class="button accentColorBG"><img src="./Assets/÷.png" alt="" style="height: 24px; width: 28px;">
                </div>
                <div class="button blackBG white">1</div>
                <div class="button blackBG white">2</div>
                <div class="button blackBG white">3</div>
                <div class="button accentColorBG white"><img src="./Assets/x.png" alt=""
                        style="height: 24px; width: 24px;"></div>
                <div class="button blackBG white">4</div>
                <div class="button blackBG white">5</div>
                <div class="button blackBG white">6</div>
                <div class="button accentColorBG white"><img src="./Assets/-.png" alt=""
                        style="height: 24px; width: 24px;"></div>
                <div class=" button blackBG white">7</div>
                <div class="button blackBG white">8</div>
                <div class="button blackBG white">9</div>
                <div class="button accentColorBG white"><img src="./Assets/+.png" alt=""
                        style="height: 24px; width: 24px;"></div>
                <div class=" button blackBG white"><img src="./Assets/-&+.png" alt="" class="buttonIMg"></div>
                <div class="button blackBG white">0</div>
                <div class="button blackBG white">.</div>
                <div class="button accentColorBG white"><img src="./Assets/=.png" alt=""
                        style="height: 24px; width: 24px;"></div>
            </div>
        </section>
    </main>
</body>

</html>
